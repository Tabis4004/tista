plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
   def keystorePropertiesFile = rootProject.file('key.properties')
   if (keystorePropertiesFile.exists()) {
       keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
   }
   
android {
    namespace = "developer.owner.tista"
    compileSdk = 34 //flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Exige par flutter_local_notifications : reecrit les API Java 8+
        // (java.time...) pour qu'elles fonctionnent sur les vieux Android.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "developer.owner.tista"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion //flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            //signingConfig signingConfigs.release

            minifyEnabled true
            //shrinkResources true
            //useProguard true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}


repositories {
    flatDir {
        dirs 'libs'
    }
}
configurations {
    implementation.exclude group: 'com.google.zxing'
}

dependencies {
    //implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    //implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    //implementation 'androidx.multidex:multidex:2.0.1'
    //implementation (name: 'A26Library-debug', ext: 'aar')
    //implementation files('libs/zxing-core-3.3.0.jar')
    implementation(name: 'CS10-C-SDK-v1.1.6', ext: 'aar')
    implementation files('libs/PrinterSDKLibV03.02.04.jar')
    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    api 'com.google.code.gson:gson:2.8.6'
    implementation files('libs/emvprocess_2.2.03.210302.jar')
    implementation files('libs/SDK4BaseBinderV2.2.12.jar')
    implementation files('libs/SDK4KeyManagerBinderV2.2.06.jar')
    implementation files('libs/SDK4EmvBinderV2.2.13.jar')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
