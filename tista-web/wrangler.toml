# Cloudflare Worker — console web TiSta+
#
# Worker « assets uniquement » : aucun script serveur, Cloudflare sert
# directement le contenu de dist/. `not_found_handling` en mode SPA renvoie
# index.html pour toute route inconnue, sans quoi un rechargement sur
# /operations donnerait un 404.
#
# Le nom ci-dessous doit être IDENTIQUE au nom du projet dans le dashboard,
# sinon `wrangler deploy` publierait vers un autre Worker.

name = "tista-web"
compatibility_date = "2026-08-18"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
